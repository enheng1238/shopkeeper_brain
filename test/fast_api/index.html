<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <button onclick="sendGet()">点我发起GET请求</button>
</body>
<script>
async function sendGet() {
    const res = await fetch("http://127.0.0.1:8000/cors");
    const data = await res.json();
    alert(data.message);
}
</script>
</html>
